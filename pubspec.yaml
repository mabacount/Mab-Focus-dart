name: mab_focus
description: Mab-Focus v3.0 - Life Capacity OS, Dual-Clock Pomodoro, Stopwatch & Multi-Calendar Tracker
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  window_manager: ^0.5.0
  screen_retriever: ^0.2.0
  excel: ^4.0.6
  file_picker: ^10.0.0
  share_plus: ^11.0.0
  http: ^1.3.0
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true